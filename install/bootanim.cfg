# =====================================================================
#  bootanim.cfg -- ESP 开机动画的配置文件
#
#  放在 ESP 的 \EFI\BootAnim\bootanim.cfg
#  编码：ASCII 或 UTF-8（带不带 BOM 都行）；行尾 CRLF/LF 都行
#  格式：键=值        '#' 或 ';' 开头的行是注释
#  键名不区分大小写；不认识的键会被忽略（保证向前兼容）
#
#  相对路径以"本配置文件所在目录"为基准（例如 ANIM=anim.baa 就是
#  \EFI\BootAnim\anim.baa）。以 '\' 开头则是绝对路径。
# =====================================================================

# =====================================================================
#  开关（1.1.0 新增）
#  ENABLED=0 就是"保留安装但临时禁用"：不画任何东西，直接交回 Windows
#  引导程序，开机速度和没装完全一样。改回 1 立刻恢复，不用卸载。
# =====================================================================
ENABLED=1

# ---------- 动画素材 ----------
# 指向 .baa 打包文件（推荐，帧多也不会拖慢 FAT 读取）
ANIM=anim.baa

# 也可以用 BMP 帧序列，三种写法都行：
#   ANIM=frames\frame0000.bmp      <- 自动推导出 frames\frame%04d.bmp
#   ANIM=frames\                   <- 自动使用 frames\frame%04d.bmp
#   ANIM=frames\frame%04d.bmp      <- 显式模板
# 此时可以用 FRAMES 指定总帧数；写 0（或不写）就自动探测到第一个缺失的帧
FRAMES=0

# ---------- 播放 ----------
# 0 = 用 .baa 头里记录的帧率；都没写就用 30
FPS=30

# 循环次数：1 = 只播一遍（推荐，不会拖慢开机）；0 = 一直循环到 TIMEOUT_MS
LOOP=1

# ---------------------------------------------------------------------
#  想做 10 秒（或更长）的动画？看这里
#
#  「多长」= 帧数 / FPS。10 秒 @30fps 就是 300 帧。
#  真正拦你的不是帧数上限（程序允许 100000 帧），而是下面这个 TIMEOUT_MS：
#  它默认 15 秒，播放器无论如何都会在这个时间内退出（防止配置写错开不了机）。
#
#    想要 10 秒     -> LOOP=1 + 300 帧 @30fps，默认配置就够了
#    想要 30 秒     -> TIMEOUT_MS=30000
#    想要不限时长   -> TIMEOUT_MS=0 且 LOOP=1（会把所有帧完整播完）
#    只要循环不超时 -> LOOP=0 + TIMEOUT_MS=20000（素材可以短，播 20 秒）
#
#  体积才是真问题：10 秒 = 300 张图。
#    * 纯色/扁平画面（RLE 压到 1% 左右）：1080p 约 24 MB，没问题
#    * 照片/渐变（几乎压不动）：1080p 一张就 8 MB，300 张根本放不下
#    所以长动画请配 1280x720 或 960x540，体积是按分辨率平方下降的。
#
#  另外整个 .baa 超过 32 MB 就不会再被读进内存了（改成逐帧读 FAT，会变慢），
#  长动画尽量把文件控制在 32 MB 以内。
# ---------------------------------------------------------------------
TIMEOUT_MS=15000

# 帧节拍方式（1.1.0 新增）：
#   auto  = 用 CPU 的 TSC 精确计时，只补足到目标帧间隔；渲染再慢也不会被
#           额外叠加一整个帧间隔，帧率与总时长都准。（默认）
#   fixed = 每渲染完一帧再固定延时 1/FPS（1.0.0 的旧行为，会把渲染时间叠加，
#           实际帧率明显低于设定值 —— 觉得"播放太慢"通常就是它）
#   off   = 完全不等，能多快就多快（渲染本身是瓶颈时最流畅）
PACING=auto

# 整个动画的最长时间（毫秒）。0 = 不限制（但要 LOOP 不为 0，否则会被强制按 15000 处理）。
# 详见上面「想做 10 秒（或更长）的动画？」那段说明。
TIMEOUT_MS=15000

# 开播前的等待（毫秒），0 = 立刻开始
LEAD_IN_MS=0

# 1 = 任意按键跳过动画；0 = 忽略按键
SKIP_KEY=1

# ---------- 画面 ----------
# native  = 1:1 居中（帧分辨率与屏幕一致时效果最好，速度最快）
# fit     = 等比缩放，完整显示，四周留背景色
# fill    = 等比缩放铺满屏幕，超出部分裁剪
# stretch = 直接拉伸（不保持宽高比）
SCALE=fit

# auto = 不缩放时直通、缩放时双线性；nearest = 最近邻（最快）；bilinear = 双线性（最平滑）
FILTER=auto

# 背景色，RRGGBB（十六进制）
BACKGROUND=000000

# 1 = 先清屏（擦掉主板厂商的开机 logo），0 = 保留
CLEAR_FIRST=1

# 视频模式：auto/native/current = 沿用固件当前分辨率（推荐）
#           也可以写 1024x768 这样指定一个模式
VIDEO_MODE=auto

# ---------- 交回控制权 ----------
# 动画播完之后要加载哪个引导程序。
# 默认的 shim 安装方式会把原始引导程序备份成 bootmgfw-orig.efi，
# 所以这里指向备份文件；备份不存在时会自动尝试下面的备用路径。
CHAINLOAD=\EFI\Microsoft\Boot\bootmgfw-orig.efi
CHAINLOAD_FALLBACK=\EFI\Microsoft\Boot\bootmgfw.efi

# 1 = 输出诊断信息（会短暂显示文字，仅排错时打开）
DEBUG=0
